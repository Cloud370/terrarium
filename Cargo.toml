[package]
name = "terrarium"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "An LLM's actions are programs: one ES2020 JavaScript program per turn, executed in a cage with hard memory, stack and time limits, one JSON result out"
repository = "https://github.com/Cloud370/terrarium"
readme = "README.md"
keywords = ["llm", "agent", "sandbox", "quickjs", "javascript"]
categories = ["development-tools"]

[dependencies]
rquickjs = { version = "0.12", default-features = false, features = ["std", "futures"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
